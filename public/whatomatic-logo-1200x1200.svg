<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="none" />
  <g transform="translate(0, 440) scale(3)">
    <defs>
      <linearGradient id="squareGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#054d44;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#25d366;stop-opacity:1" />
      </linearGradient>
    </defs>
    
    <!-- "What" -->
    <text x="10" y="70" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#054d44">What</text>
    
    <!-- WhatsApp Bubble "o" -->
    <circle cx="150" cy="58" r="18" fill="#25d366" />
    <path d="M150 48c-5.5 0-10 4.5-10 10 0 2 0.6 3.8 1.6 5.4l-1.6 5.6 5.7-1.5c1.4 0.9 3.1 1.5 4.9 1.5 5.5 0 10-4.5 10-10s-4.5-10-10-10z" fill="#fff" />
    
    <!-- "matic" -->
    <text x="175" y="70" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="url(#squareGrad)">matic</text>
    
    <!-- Mascot Head -->
    <g transform="translate(335, 35) scale(0.6)">
      <path d="M0 0c15 0 25 10 25 25s-10 25-25 25-25-10-25-25 10-25 25-25z" fill="#25d366" />
      <circle cx="-8" cy="20" r="3" fill="#fff" />
      <circle cx="8" cy="20" r="3" fill="#fff" />
    </g>
    
    <!-- Subtitle -->
    <text x="145" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4a5568">WhatsApp Automation</text>
  </g>
</svg>
