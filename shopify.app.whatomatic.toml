# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d04dbfca79ff1cd51fb3eb76e32ef6e7"
name = "Whatomatic-Whatsapp Automation"
application_url = "https://whatflow-alpha.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [
  "checkouts/abandoned",
  "checkouts/create",
  "fulfillments/update",
  "orders/cancelled",
  "orders/create"
]
  uri = "https://api.whatomatic.com/Api/webhooks/shopify"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_checkouts,write_checkouts,read_customers,write_customers,read_fulfillments,write_fulfillments,read_orders,write_orders,write_script_tags,read_script_tags"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://whatflow-alpha.vercel.app/api/auth/callback",
  "https://whatflow-alpha.vercel.app/api/auth/tokens",
  "https://api.whatomatic.com/Api/auth/shopify/callback"
]
